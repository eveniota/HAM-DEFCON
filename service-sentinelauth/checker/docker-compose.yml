services:
  sentinelauth-checker:
    build: .
    ports:
      - "18002:8000"
    environment:
      - MONGO_HOST=sentinelauth-mongo
      - MONGO_PORT=27017
      - MONGO_USER=sentinelauth
      - MONGO_PASSWORD=sentinelauth
    depends_on:
      - sentinelauth-mongo
    restart: unless-stopped

  sentinelauth-mongo:
    image: mongo:7
    volumes:
      - ./data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentinelauth
      MONGO_INITDB_ROOT_PASSWORD: sentinelauth
    restart: unless-stopped
